<script>
  (function(){
    try{
      const saved=localStorage.getItem("shiguang_theme_v1");
      const theme=(saved==="light"||saved==="dark")
        ? saved
        : (window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
      document.documentElement.setAttribute("data-theme",theme);
    }catch(e){ /* use the system theme when storage is unavailable */ }
  })();
</script>
<style>
  :root{
    --bg:#F8F5EE;
    --surface:#FFFFFF;
    --surface-soft:#F1ECDF;
    --ink:#4A443B;
    --ink-2:#96897A;
    --ink-3:#C6BCAC;
    --line:#EAE2D2;
    --accent:#7E8C6C;
    --accent-ink:#FFFFFF;
    --accent-tint:rgba(126,140,108,.13);
    --amber:#C79B6E;
    --amber-tint:rgba(199,155,110,.16);
    --teal:#A98B8B;
    --teal-tint:rgba(169,139,139,.15);
    --danger:#B25C4E;
    --danger-tint:rgba(178,92,78,.14);
    --gold:#BFA46A;
    --shadow:0 18px 40px -22px rgba(74,68,59,.28);
    --shadow-sm:0 6px 16px -10px rgba(74,68,59,.22);
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#211D16;
      --surface:#2A251C;
      --surface-soft:#332C21;
      --ink:#ECE4D6;
      --ink-2:#B3A793;
      --ink-3:#83765F;
      --line:#443B2C;
      --accent:#9DB08C;
      --accent-ink:#20261A;
      --accent-tint:rgba(157,176,140,.16);
      --amber:#D8AC7C;
      --amber-tint:rgba(216,172,124,.16);
      --teal:#C0A0A0;
      --teal-tint:rgba(192,160,160,.16);
      --danger:#D98A7C;
      --danger-tint:rgba(217,138,124,.16);
      --gold:#D4BB84;
      --shadow:0 18px 44px -20px rgba(0,0,0,.55);
      --shadow-sm:0 6px 18px -10px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#211D16;
    --surface:#2A251C;
    --surface-soft:#332C21;
    --ink:#ECE4D6;
    --ink-2:#B3A793;
    --ink-3:#83765F;
    --line:#443B2C;
    --accent:#9DB08C;
    --accent-ink:#20261A;
    --accent-tint:rgba(157,176,140,.16);
    --amber:#D8AC7C;
    --amber-tint:rgba(216,172,124,.16);
    --teal:#C0A0A0;
    --teal-tint:rgba(192,160,160,.16);
    --danger:#D98A7C;
    --danger-tint:rgba(217,138,124,.16);
    --gold:#D4BB84;
    --shadow:0 18px 44px -20px rgba(0,0,0,.55);
    --shadow-sm:0 6px 18px -10px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Nunito',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased;
    position:fixed;inset:0;
    height:100%;
    min-height:0;
    overflow:hidden;
    display:flex;
    justify-content:center;
  }
  .app-shell{
    width:100%;
    max-width:460px;
    height:100%;
    min-height:0;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow);
    touch-action:manipulation;
  }
  @media (min-width:520px){
    body{padding:28px 12px;}
    .app-shell{
      height:min(880px,calc(100vh - 56px));
      height:min(880px,calc(100dvh - 56px));
      border-radius:32px;
    }
  }

  /* ---------- top bar ---------- */
  .app-header{
    flex:0 0 auto;position:relative;z-index:30;background:var(--bg);
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 22px 14px;flex:none;
  }
  .brand{display:flex;align-items:baseline;gap:9px;}
  .brand-mark{
    font-family:'Fraunces',serif;font-weight:600;font-size:26px;letter-spacing:.01em;
    font-optical-sizing:auto;
  }
  .brand-sub{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.02em;}
  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;border:none;background:var(--surface);
    display:flex;align-items:center;justify-content:center;color:var(--ink-2);
    cursor:pointer;box-shadow:var(--shadow-sm);flex:none;
  }
  .icon-btn:hover{color:var(--accent);}
  .icon-btn.is-on{color:var(--accent);background:var(--accent-tint);box-shadow:inset 0 0 0 1px var(--accent),var(--shadow-sm);}
  .theme-icon{width:17px;height:17px;}
  .theme-icon-sun{display:none;}
  :root[data-theme="dark"] .theme-icon-moon{display:none;}
  :root[data-theme="dark"] .theme-icon-sun{display:block;}
  .icon-btn:focus-visible,.chip:focus-visible,.nav-btn:focus-visible,.fab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }
  .streak-badge{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);border-radius:999px;padding:7px 14px 7px 10px;
    box-shadow:var(--shadow-sm);font-weight:800;font-size:14px;color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .streak-badge svg{flex:none;}

  /* ---------- stat row ---------- */
  .stat-row{display:flex;gap:8px;margin:0 22px 16px;flex:none;}
  .points-badge{
    display:flex;align-items:center;gap:6px;border:none;cursor:pointer;
    background:var(--surface);border-radius:999px;padding:7px 14px 7px 10px;
    box-shadow:var(--shadow-sm);font-weight:800;font-size:14px;color:var(--gold);
    font-family:inherit;font-variant-numeric:tabular-nums;
  }
  .points-badge svg{flex:none;}

  .view{
    padding:2px 22px 116px;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:manipulation;
  }
  .view[hidden]{display:none!important;}

  /* ---------- bottom nav ---------- */
  .bottom-nav{
    position:relative;left:auto;right:auto;bottom:auto;width:100%;transform:none;
    display:flex;align-items:flex-start;flex:none;
    background:var(--surface);border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:15;
  }
  .nav-btn{
    flex:1;border:none;background:transparent;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;
    color:var(--ink-3);font-family:inherit;font-weight:800;font-size:11px;
  }
  .nav-btn svg{width:21px;height:21px;}
  .nav-btn.active{color:var(--accent);}
  .nav-btn-center{margin-top:-26px;}
  .nav-center-circle{
    width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px -8px rgba(126,140,108,.55);
    border:4px solid var(--surface);
  }
  .nav-btn-center svg{width:24px;height:24px;}
  .nav-btn-center.active{color:var(--accent);}
  .nav-btn-center span:last-child{margin-top:1px;}
  @media (max-width:359px){
    .topbar{padding:18px 16px 12px;}
    .brand{gap:6px;}
    .brand-mark{font-size:23px;}
    .brand-sub{font-size:11px;}
    .topbar-actions{gap:6px;}
    .icon-btn{width:36px;height:36px;}
    .stat-row{margin-left:16px;margin-right:16px;}
    .view{padding-left:16px;padding-right:16px;}
    .section{border-radius:22px;}
  }

  /* ---------- section ---------- */
  .section{
    margin-bottom:18px;background:var(--surface);border-radius:var(--radius-lg);
    padding:16px 14px 10px;box-shadow:var(--shadow-sm);border:1px solid var(--line);
    transition:box-shadow .2s ease,transform .2s ease;
  }
  .section:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
  .section-head{
    display:flex;align-items:center;gap:8px;margin:0 2px 12px;flex-wrap:wrap;
    color:var(--ink-2);font-weight:800;font-size:13px;letter-spacing:.03em;text-transform:uppercase;
  }
  .section-head .count{
    font-size:12px;color:var(--ink-3);font-weight:700;letter-spacing:0;text-transform:none;
    font-variant-numeric:tabular-nums;
  }
  .sort-icon-btn{
    margin-left:auto;border:1.4px solid var(--line);background:var(--surface-soft);color:var(--ink-2);
    border-radius:50%;width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;
  }
  .sort-icon-btn.is-set{border-color:var(--accent);color:var(--accent);background:var(--accent-tint);}
  .sort-icon-btn svg{width:14px;height:14px;}
  .schedule-head-title{display:inline-flex;align-items:center;gap:6px;}
  .schedule-filter-btn{margin-left:auto;}
  .schedule-filter-btn + .sort-icon-btn{margin-left:0;}
  .sort-menu{
    position:fixed;z-index:95;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);
    padding:6px;width:168px;
  }
  .sort-menu button{
    display:block;width:100%;text-align:left;border:none;background:transparent;color:var(--ink);
    font-family:inherit;font-weight:700;font-size:12.5px;padding:9px 10px;border-radius:10px;cursor:pointer;
  }
  .sort-menu button.active{background:var(--accent-tint);color:var(--accent);}
  .empty-hint{
    color:var(--ink-3);font-size:13.5px;padding:14px 4px;font-weight:600;
  }

  .card-list{display:flex;flex-direction:column;}
  .item-card{
    display:flex;align-items:center;gap:10px;
    background:transparent;border-radius:var(--radius-sm);
    padding:11px 4px;border-bottom:1px solid var(--line);
    border-left:3px solid transparent;
  }
  .item-card:last-child{border-bottom:none;}
  .item-card.is-done{opacity:.6;}
  .item-card.conflict{border-left-color:var(--danger);}
  .item-card.dragging{
    background:var(--surface-soft);box-shadow:var(--shadow);border-radius:var(--radius-md);
    opacity:.95;position:relative;z-index:50;border-bottom-color:transparent;
  }

  .drag-handle{
    flex:none;border:none;background:transparent;color:var(--ink-3);cursor:grab;
    padding:6px 2px;display:flex;align-items:center;touch-action:none;
  }
  .drag-handle:active{cursor:grabbing;}
  .drag-handle svg{width:16px;height:16px;}

  .priority-stars{display:inline-flex;gap:1px;align-items:center;}
  .priority-stars svg{width:10px;height:10px;}

  .check{
    width:28px;height:28px;border-radius:50%;flex:none;cursor:pointer;
    border:2.4px solid var(--line);background:transparent;
    display:flex;align-items:center;justify-content:center;color:transparent;
    transition:all .15s ease;
  }
  .check svg{width:15px;height:15px;}
  .item-card.recurring .check{border-color:var(--accent);}
  .item-card.temp .check{border-color:var(--amber);}
  .item-card.schedule .check{border-color:var(--teal);}
  .item-card.recurring.is-done .check{background:var(--accent);color:#fff;}
  .item-card.temp.is-done .check{background:var(--amber);color:#fff;}
  .item-card.schedule.is-done .check{background:var(--teal);color:#fff;}

  .item-body{flex:1;min-width:0;}
  .item-name{font-weight:800;font-size:15px;line-height:1.3;}
  .item-card.temp .item-name,.item-card.schedule .item-name{cursor:text;user-select:none;-webkit-user-select:none;}
  .item-card.is-done .item-name{text-decoration:line-through;text-decoration-color:var(--ink-3);}
  .item-meta{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:var(--ink-2);font-weight:700;flex-wrap:wrap;}
  .meta-time{color:var(--teal);}
  .meta-conflict{color:var(--danger);display:flex;align-items:center;gap:3px;}
  .meta-chip{
    background:var(--surface-soft);border-radius:999px;padding:2px 9px;color:var(--ink-2);
    font-variant-numeric:tabular-nums;
  }

  .duration-tag{
    flex:none;border:none;border-radius:999px;padding:6px 11px;font-weight:800;font-size:12px;
    background:var(--surface-soft);color:var(--ink-2);cursor:pointer;font-variant-numeric:tabular-nums;
  }
  .duration-tag.filled{background:var(--accent-tint);color:var(--accent);}
  .item-card.temp .duration-tag.filled{background:var(--amber-tint);color:var(--amber);}
  .item-del{
    flex:none;border:none;background:transparent;color:var(--ink-3);cursor:pointer;padding:4px;
    display:flex;
  }
  .item-del:hover{color:var(--danger);}

  .recurring-manage{
    display:block;margin:6px auto 0;background:none;border:none;color:var(--ink-3);
    font-size:12.5px;font-weight:700;cursor:pointer;padding:6px;
  }
  .recurring-manage:hover{color:var(--accent);}

  /* ---------- fab ---------- */
  .fab{
    position:absolute;right:22px;bottom:calc(84px + env(safe-area-inset-bottom));
    width:60px;height:60px;border-radius:50%;
    background:var(--accent);color:var(--accent-ink);border:none;box-shadow:0 14px 26px -10px rgba(126,140,108,.45);
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;
    transition:transform .15s ease;
  }
  .fab:hover{transform:scale(1.05);}
  .fab svg{width:26px;height:26px;}

  /* ---------- calendar ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 16px;}
  .cal-month{font-family:'Fraunces',serif;font-weight:600;font-size:21px;font-optical-sizing:auto;}
  .cal-nav{display:flex;gap:8px;}
  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px;}
  .weekday-row span{text-align:center;font-size:11.5px;font-weight:800;color:var(--ink-3);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-cell{
    aspect-ratio:1;border-radius:14px;border:none;background:var(--surface);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    cursor:pointer;position:relative;color:var(--ink);font-weight:800;font-size:13px;
    font-family:'Nunito',sans-serif;font-variant-numeric:tabular-nums;
  }
  .cal-cell.pad{visibility:hidden;pointer-events:none;}
  .cal-cell.today{box-shadow:inset 0 0 0 2px var(--accent);}
  .cal-cell .dots{display:flex;gap:2px;height:5px;}
  .cal-cell .dots i{width:5px;height:5px;border-radius:50%;background:var(--teal);display:block;}
  .cal-cell .dots i.journal-dot{background:var(--gold);}
  .cal-legend{display:flex;align-items:center;gap:14px;margin-top:16px;font-size:12px;color:var(--ink-2);font-weight:700;flex-wrap:wrap;}
  .cal-legend .sw{display:inline-flex;align-items:center;gap:6px;}
  .cal-legend .dot{width:9px;height:9px;border-radius:50%;}

  .day-summary-card{
    margin-top:18px;background:var(--surface);border-radius:var(--radius-md);padding:16px 16px 4px;
    box-shadow:var(--shadow-sm);
  }
  .day-summary-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;}
  .day-summary-date{font-family:'Fraunces',serif;font-weight:600;font-size:18px;}
  .day-summary-total{font-size:13px;color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums;}
  .timeline{list-style:none;margin:14px 0 4px;padding:0;}
  .timeline li{display:flex;gap:12px;padding-bottom:16px;position:relative;}
  .timeline li:not(:last-child)::before{
    content:"";position:absolute;left:26px;top:22px;bottom:-4px;width:2px;background:var(--line);
  }
  .tl-time{width:52px;flex:none;font-size:12px;font-weight:800;color:var(--ink-2);padding-top:2px;font-variant-numeric:tabular-nums;text-align:right;}
  .tl-dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;z-index:1;}
  .tl-body{flex:1;background:var(--surface-soft);border-radius:12px;padding:9px 12px;min-width:0;}
  .tl-name{font-weight:800;font-size:14px;}
  .tl-sub{font-size:12px;color:var(--ink-2);font-weight:700;margin-top:2px;}

  /* ---------- daily journal ---------- */
  .journal-section{padding-bottom:16px;}
  .journal-intro{color:var(--ink-2);font-size:12.5px;font-weight:700;line-height:1.55;margin:-2px 2px 12px;}
  .journal-completed{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 11px;}
  .journal-completed:empty{display:none;}
  .journal-task-chip{
    background:var(--accent-tint);color:var(--accent);border-radius:999px;padding:5px 10px;
    font-size:11.5px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .journal-textarea{
    width:100%;min-height:122px;resize:vertical;border:1.6px solid var(--line);border-radius:16px;
    background:var(--surface-soft);color:var(--ink);font-family:inherit;font-size:14px;font-weight:650;
    line-height:1.7;padding:13px 14px;display:block;
  }
  .journal-textarea:focus{border-color:var(--accent);background:var(--surface);outline:none;}
  .journal-actions{display:flex;gap:9px;margin-top:10px;}
  .journal-actions .btn{margin-top:0;padding:12px 10px;font-size:14px;}
  .journal-day-card{margin-top:14px;background:var(--surface-soft);border-radius:16px;padding:13px 14px;}
  .journal-day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px;}
  .journal-day-title{font-weight:900;font-size:13px;color:var(--accent);}
  .journal-edit-link{
    border:none;background:var(--accent-tint);color:var(--accent);border-radius:999px;padding:6px 10px;
    font-family:inherit;font-size:11.5px;font-weight:800;cursor:pointer;flex:none;
  }
  .journal-day-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;line-height:1.7;color:var(--ink);font-weight:650;}
  .journal-day-empty{color:var(--ink-3);font-size:12.5px;font-weight:700;}
  .journal-overview-sheet{max-height:92vh;max-height:92dvh;}
  .journal-overview-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .journal-overview-head .sheet-title{margin-bottom:3px;}
  .journal-overview-sub{color:var(--ink-3);font-size:12px;font-weight:700;}
  .journal-sort-btn{
    border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;
    padding:8px 11px;font-family:inherit;font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap;
  }
  .journal-overview-list{display:flex;flex-direction:column;gap:12px;}
  .journal-entry-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow-sm);}
  .journal-entry-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .journal-entry-date{font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
  .journal-entry-tasks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .journal-entry-text{background:var(--surface-soft);border-radius:13px;padding:11px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.7;font-weight:650;}
  .journal-entry-empty{color:var(--ink-3);font-size:12.5px;font-weight:700;padding:4px 1px;}

  /* ---------- modal / sheet ---------- */
  .backdrop{
    position:fixed;inset:0;background:rgba(30,20,14,.4);z-index:90;
    display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;
    transition:opacity .2s ease;
  }
  .backdrop.show{opacity:1;pointer-events:auto;}
  .backdrop.editing-layer{z-index:100;}
  .backdrop.center{align-items:center;padding:20px;}
  .sheet{
    width:100%;max-width:460px;background:var(--bg);border-radius:26px 26px 0 0;
    padding:10px 22px 26px;box-shadow:0 -20px 50px -20px rgba(0,0,0,.4);
    transform:translateY(20px);transition:transform .22s ease;max-height:86vh;overflow-y:auto;
  }
  .backdrop.show .sheet{transform:translateY(0);}
  .sheet-grip{width:38px;height:4px;background:var(--line);border-radius:99px;margin:6px auto 14px;}
  .sheet-title{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:0 0 16px;}

  .type-switch{display:flex;gap:8px;margin-bottom:18px;}
  .type-switch[hidden],#edit-schedule-note[hidden]{display:none!important;}
  .type-opt{
    flex:1;border:1.6px solid var(--line);background:var(--surface);border-radius:14px;
    padding:12px 6px;text-align:center;cursor:pointer;font-weight:800;font-size:12.5px;color:var(--ink-2);
  }
  .type-opt.active{border-color:var(--accent);color:var(--accent);background:var(--accent-tint);}
  .type-opt .ic{display:block;margin:0 auto 6px;width:20px;height:20px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:800;color:var(--ink-2);margin-bottom:6px;}
  .field input[type="text"],.field input[type="date"],.field input[type="number"],.field select{
    width:100%;border:1.6px solid var(--line);background:var(--surface);border-radius:12px;
    padding:11px 13px;font-size:15px;font-family:inherit;color:var(--ink);font-weight:700;
  }
  .time-picker-btn{
    width:100%;border:1.6px solid var(--line);background:var(--surface);border-radius:12px;
    padding:11px 13px;font-size:15px;font-family:inherit;color:var(--ink);font-weight:700;
    text-align:left;cursor:pointer;font-variant-numeric:tabular-nums;
  }
  .time-picker-btn.chosen{border-color:var(--accent);color:var(--accent);background:var(--accent-tint);}
  .date-picker-btn{
    width:100%;border:1.6px solid var(--line);background:var(--surface);border-radius:12px;
    padding:11px 13px;font-size:15px;font-family:inherit;color:var(--ink);font-weight:700;
    text-align:left;cursor:pointer;font-variant-numeric:tabular-nums;
  }
  .date-picker-btn.chosen{border-color:var(--accent);color:var(--accent);background:var(--accent-tint);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  #schedule-time-fields[hidden],#schedule-reminder-field[hidden]{display:none!important;}

  /* ---------- time wheel picker ---------- */
  .time-wheel-sheet{
    width:100%;max-width:460px;background:var(--bg);border-radius:26px 26px 0 0;
    padding:10px 22px 26px;box-shadow:0 -20px 50px -20px rgba(0,0,0,.4);
    transform:translateY(20px);transition:transform .22s ease;
  }
  .backdrop.show .time-wheel-sheet{transform:translateY(0);}
  .wheel-row{
    display:flex;justify-content:center;gap:10px;position:relative;height:190px;margin:8px 0 18px;
  }
  .wheel-row::before{
    content:"";position:absolute;left:0;right:0;top:75px;height:40px;
    background:var(--accent-tint);border-radius:14px;pointer-events:none;z-index:1;
  }
  .wheel-row::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
    background:linear-gradient(var(--bg),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,var(--bg));
  }
  .wheel-col{
    width:76px;height:190px;overflow-y:scroll;scroll-snap-type:y mandatory;
    -ms-overflow-style:none;scrollbar-width:none;
  }
  .wheel-col::-webkit-scrollbar{display:none;}
  .wheel-col .wheel-pad{height:75px;flex:none;}
  .wheel-item{
    height:40px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;
    font-weight:800;font-size:17px;color:var(--ink-3);font-variant-numeric:tabular-nums;
    transition:color .15s ease,font-size .15s ease;cursor:pointer;
  }
  .wheel-item.selected{color:var(--accent);font-size:19px;}
  .time-wheel-actions{display:flex;gap:10px;}
  .time-wheel-actions .btn{margin-top:0;}

  /* ---------- date picker ---------- */
  .date-picker-modal{
    width:100%;max-width:380px;background:var(--surface);border-radius:24px;padding:20px;
    box-shadow:var(--shadow);
  }
  .date-picker-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .date-picker-month{font-family:'Fraunces',serif;font-weight:600;font-size:20px;}
  .date-picker-weekdays,.date-picker-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .date-picker-weekdays{margin-bottom:7px;}
  .date-picker-weekdays span{text-align:center;color:var(--ink-3);font-size:11.5px;font-weight:800;}
  .date-day{
    aspect-ratio:1;border:none;border-radius:12px;background:var(--surface-soft);color:var(--ink);
    font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;
  }
  .date-day.pad{visibility:hidden;pointer-events:none;}
  .date-day.today{box-shadow:inset 0 0 0 1.5px var(--accent);}
  .date-day.selected{background:var(--accent);color:var(--accent-ink);box-shadow:none;}
  .date-picker-actions{display:flex;gap:10px;margin-top:18px;}
  .date-picker-actions .btn{margin-top:0;}
  .lead-toggle-label{
    display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:var(--ink);
    cursor:pointer;margin-bottom:0;
  }
  .lead-toggle-label input{width:18px;height:18px;accent-color:var(--accent);flex:none;}
  .lead-amount-row{margin-top:10px;}
  .lead-amount-row[hidden]{display:none!important;}
  .repeat-switch{display:flex;gap:7px;}
  .repeat-opt{
    flex:1;border:1.6px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 6px;
    color:var(--ink-2);font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;
  }
  .repeat-opt.active{border-color:var(--accent);background:var(--accent-tint);color:var(--accent);}
  .repeat-details{margin-top:11px;background:var(--surface-soft);border-radius:15px;padding:12px;}
  .repeat-details[hidden],.weekly-options[hidden]{display:none!important;}
  .repeat-sub-label{display:block;color:var(--ink-2);font-size:12px;font-weight:800;margin:0 0 7px;}
  .weekday-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px;}
  .weekday-btn{
    aspect-ratio:1;border:1.4px solid var(--line);border-radius:50%;background:var(--surface);color:var(--ink-2);
    font-family:inherit;font-size:11.5px;font-weight:900;cursor:pointer;padding:0;
  }
  .weekday-btn.active{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);}
  .repeat-note{font-size:11.5px;color:var(--ink-3);font-weight:700;line-height:1.5;margin-top:7px;}
  .hint-warn{
    display:block;background:transparent;color:var(--ink-2);
    border-radius:0;padding:0 2px;font-size:12.5px;font-weight:700;margin:-2px 0 14px;
  }
  .hint-warn[hidden]{display:none!important;}
  .star-picker{display:flex;gap:4px;}
  .star-picker button{
    border:none;background:var(--surface-soft);padding:6px;cursor:pointer;color:var(--line);
    border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s ease;
  }
  .star-picker button svg{width:24px;height:24px;}
  .star-picker button.filled{color:var(--gold);background:var(--amber-tint);}
  .duration-picker{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    border:1.6px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;
    font-weight:800;font-size:13px;color:var(--ink-2);cursor:pointer;
  }
  .chip.active{border-color:var(--accent);background:var(--accent-tint);color:var(--accent);}

  .btn{
    width:100%;border:none;border-radius:14px;padding:14px;font-weight:800;font-size:15.5px;
    cursor:pointer;font-family:inherit;
  }
  .btn-primary{background:var(--accent);color:var(--accent-ink);margin-top:6px;}
  .btn-ghost{background:var(--surface-soft);color:var(--ink-2);margin-top:8px;}
  .btn-danger-ghost{background:var(--danger-tint);color:var(--danger);margin-top:8px;}

  /* popover for optional minutes on a row */
  .popover{
    position:fixed;z-index:95;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);
    padding:12px;display:flex;gap:8px;flex-wrap:wrap;width:230px;
  }

  /* manage recurring modal */
  .manage-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .manage-row:last-child{border-bottom:none;}
  .manage-row .m-main{flex:1;min-width:0;}
  .manage-row .m-name{font-weight:800;font-size:14.5px;overflow-wrap:anywhere;}
  .manage-row .m-sub{font-size:11.5px;color:var(--ink-3);font-weight:700;margin-top:3px;line-height:1.45;}
  .manage-row .priority-stars{margin-top:4px;}
  .manage-row .m-count{font-size:12px;color:var(--ink-3);font-weight:700;font-variant-numeric:tabular-nums;}
  .manage-actions{display:flex;align-items:center;gap:4px;}
  .item-edit{
    flex:none;border:none;background:transparent;color:var(--ink-3);cursor:pointer;padding:5px;display:flex;
  }
  .item-edit:hover{color:var(--accent);}

  /* ---------- custom delete confirmation ---------- */
  .confirm-modal{
    width:100%;max-width:340px;background:var(--surface);border-radius:24px;padding:25px 22px 21px;
    text-align:center;box-shadow:var(--shadow);
  }
  .confirm-icon{
    width:54px;height:54px;border-radius:50%;margin:0 auto 14px;background:var(--accent-tint);color:var(--accent);
    display:flex;align-items:center;justify-content:center;
  }
  .confirm-modal h3{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:0 0 7px;}
  .confirm-modal p{color:var(--ink-2);font-weight:700;font-size:13.5px;line-height:1.55;margin:0 0 18px;}
  .confirm-actions{display:flex;gap:10px;}
  .confirm-actions .btn{margin-top:0;}
  .btn-confirm-delete{background:var(--accent);color:var(--accent-ink);}

  /* ---------- garden / pets ---------- */
  .garden-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 2px 14px;}
  .garden-title{font-family:'Fraunces',serif;font-weight:600;font-size:20px;}
  .garden-sub{font-size:12.5px;color:var(--ink-2);font-weight:700;margin-top:2px;line-height:1.45;}
  .garden-actions{display:flex;align-items:stretch;gap:7px;flex:none;}
  .btn-adopt{
    border:none;background:var(--accent);color:var(--accent-ink);border-radius:999px;
    padding:9px 13px;font-weight:800;font-size:12px;cursor:pointer;flex:none;font-family:inherit;
  }
  .btn-zoo-secondary{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}
  .gacha-entry{
    display:flex;align-items:center;gap:6px;border:0;background:var(--teal-tint);color:var(--teal);
    border-radius:999px;padding:9px 12px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:800;
  }
  .gacha-entry:hover{filter:brightness(.97);}
  .gacha-entry-icon{position:relative;width:17px;height:16px;flex:none;}
  .gacha-entry-icon::before{content:"";position:absolute;left:2px;top:3px;width:11px;height:12px;border:1.5px solid currentColor;border-radius:3px;background:var(--surface);transform:rotate(-7deg);}
  .gacha-entry-icon::after{content:"";position:absolute;left:6px;top:1px;width:10px;height:12px;border:1.5px solid currentColor;border-radius:3px;background:var(--teal-tint);transform:rotate(7deg);}
  .zoo-habitat{
    position:relative;height:430px;border-radius:0;overflow:hidden;touch-action:none;
    background:var(--bg);box-shadow:none;
  }
  .zoo-fence{display:none;}
  .zoo-pet{
    position:absolute;width:90px;height:112px;border:0;background:transparent;padding:0;
    font-family:inherit;color:var(--ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
    transition:left 1.7s linear,top 1.7s linear;z-index:2;
  }
  .zoo-pet.is-dragging{transition:none;z-index:8;cursor:grabbing;}
  .zoo-pet-canvas{display:block;width:90px;height:90px;image-rendering:pixelated;filter:drop-shadow(0 6px 2px rgba(72,58,43,.14));transform:scaleX(var(--pet-facing,1));}
  .zoo-pet-name{display:inline-block;margin-top:-2px;background:rgba(255,255,255,.72);border-radius:999px;padding:3px 8px;font-size:10.5px;font-weight:800;line-height:1.2;}
  [data-theme="dark"] .zoo-pet-name{background:rgba(41,38,33,.72);}
  .zoo-pet-mood{position:absolute;right:2px;top:2px;min-width:26px;padding:4px 6px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow-sm);font-size:11px;font-weight:800;opacity:0;transform:translateY(4px);transition:.2s;pointer-events:none;}
  .zoo-pet.show-mood .zoo-pet-mood{opacity:1;transform:translateY(0);}
  .zoo-pet.is-bouncing .zoo-pet-canvas{animation:zooPetBounce .38s ease-out;}
  .zoo-pet.is-held .zoo-pet-canvas{animation:zooPetHeld .7s ease-in-out infinite alternate;filter:drop-shadow(0 14px 4px rgba(72,58,43,.2));}
  .zoo-pet.is-eating .zoo-pet-canvas{animation:zooPetEat .62s steps(2,end) 2;}
  @keyframes zooPetBounce{0%{transform:scaleX(var(--pet-facing,1)) translateY(0) scale(1)}25%{transform:scaleX(var(--pet-facing,1)) translateY(5px) scale(1.12,.82)}58%{transform:scaleX(var(--pet-facing,1)) translateY(-18px) scale(.9,1.15)}100%{transform:scaleX(var(--pet-facing,1)) translateY(0) scale(1)}}
  @keyframes zooPetHeld{from{transform:scaleX(var(--pet-facing,1)) translateY(-9px) rotate(-3deg) scale(1.04)}to{transform:scaleX(var(--pet-facing,1)) translateY(-13px) rotate(3deg) scale(1.04)}}
  @keyframes zooPetEat{0%,100%{transform:scaleX(var(--pet-facing,1)) translateY(0)}50%{transform:scaleX(var(--pet-facing,1)) translateY(4px)}}
  .zoo-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;color:#6f695d;font-size:13px;font-weight:800;line-height:1.7;}
  [data-theme="dark"] .zoo-empty{color:#d8d1c5;}
  .zoo-selected{margin-top:12px;background:var(--surface);border-radius:20px;padding:13px 14px;box-shadow:var(--shadow-sm);}
  .zoo-selected[hidden]{display:none;}
  .zoo-selected-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;}
  .zoo-selected-name{font-weight:800;font-size:14px;}
  .zoo-selected-state{font-size:11px;color:var(--ink-2);font-weight:700;margin-top:1px;}
  .zoo-meter-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px;}
  .zoo-meter-label{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-2);font-weight:800;margin-bottom:4px;}
  .zoo-meter{height:7px;border-radius:99px;background:var(--surface-soft);overflow:hidden;}
  .zoo-meter i{display:block;height:100%;border-radius:99px;transition:width .25s ease;}
  .zoo-meter.hunger i{background:#d9a062;}.zoo-meter.mood i{background:#d99098;}
  .zoo-food-row{display:flex;gap:7px;flex-wrap:wrap;}
  .zoo-food-btn{border:1.4px solid var(--line);background:var(--surface-soft);color:var(--ink);border-radius:12px;padding:7px 10px;font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;}
  .zoo-food-btn{display:inline-flex;align-items:center;gap:6px;}
  .zoo-food-btn:disabled{opacity:.42;cursor:not-allowed;}
  .zoo-food-icon{width:22px;height:22px;image-rendering:pixelated;flex:none;}
  .zoo-critical{color:#b86858;}
  .garden-empty{
    grid-column:1/-1;text-align:center;color:var(--ink-3);font-weight:700;font-size:13.5px;
    padding:50px 10px;
  }
  .sheet-desc{color:var(--ink-2);font-weight:700;font-size:13.5px;margin:-8px 0 16px;}
  .sheet-desc b{color:var(--gold);}
  .species-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px;}
  .species-opt{
    border:1.6px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 4px 10px;
    text-align:center;cursor:pointer;font-family:inherit;
  }
  .species-opt canvas{width:54px;height:54px;image-rendering:pixelated;display:block;margin:0 auto 5px;}
  .species-opt .s-name{font-size:12px;font-weight:800;color:var(--ink);}
  .species-opt.owned{opacity:.4;cursor:default;}
  .species-opt.disabled{opacity:.45;cursor:not-allowed;}
  .feed-pet-preview{text-align:center;margin-bottom:18px;}
  .feed-pet-preview canvas{width:94px;height:94px;image-rendering:pixelated;display:block;margin:0 auto;}
  .feed-pet-preview .fp-name{font-family:'Fraunces',serif;font-weight:600;font-size:19px;margin-top:4px;}
  .feed-pet-preview .fp-stage{font-size:12.5px;color:var(--ink-2);font-weight:700;margin:4px 0 10px;}
  .feed-preview-meters{max-width:230px;margin:10px auto 0;display:grid;gap:8px;}
  .food-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;}
  .food-opt{
    display:flex;align-items:center;gap:12px;border:1.6px solid var(--line);background:var(--surface);
    border-radius:14px;padding:12px 14px;cursor:pointer;font-family:inherit;text-align:left;width:100%;
  }
  .food-opt .f-food-icon{width:32px;height:32px;image-rendering:pixelated;flex:none;}
  .food-opt .f-body{flex:1;}
  .food-opt .f-name{font-weight:800;font-size:14px;}
  .food-opt .f-desc{font-size:11.5px;color:var(--ink-2);font-weight:700;}
  .food-opt .f-cost{font-weight:800;color:var(--gold);font-size:13px;flex:none;font-variant-numeric:tabular-nums;}
  .food-opt.disabled{opacity:.4;cursor:not-allowed;}
  .food-opt .f-owned{font-size:11px;color:var(--ink-2);font-weight:800;}
  .feed-hint{font-size:12px;line-height:1.5;color:var(--ink-2);font-weight:700;text-align:center;margin:-6px 0 14px;}

  .gacha-sheet{text-align:center;}
  .gacha-sheet .sheet-title{margin-bottom:4px;}
  .gacha-desc{color:var(--ink-2);font-size:12.5px;font-weight:700;line-height:1.5;margin:0 0 12px;}
  .gacha-balance{display:inline-flex;align-items:center;gap:5px;background:var(--surface-soft);color:var(--ink-2);border-radius:999px;padding:6px 11px;font-size:11px;font-weight:900;margin-bottom:12px;}
  .gacha-machine{position:relative;width:112px;height:102px;margin:0 auto 9px;perspective:240px;}
  .gacha-card-back,.gacha-card-front{position:absolute;width:62px;height:78px;border-radius:15px;}
  .gacha-card-back{left:18px;top:12px;background:var(--teal-tint);border:2px solid var(--teal);transform:rotate(-9deg);}
  .gacha-card-back::before{content:"";position:absolute;inset:8px;border:1px dashed currentColor;border-radius:10px;opacity:.55;}
  .gacha-card-front{left:39px;top:10px;background:var(--surface);border:2px solid var(--accent);transform:rotate(8deg);box-shadow:var(--shadow-sm);}
  .gacha-card-front::before{content:"✦";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);width:31px;height:31px;border-radius:50%;background:var(--accent-tint);color:var(--accent);font-size:17px;line-height:31px;font-weight:900;}
  .gacha-card-front::after{content:"";position:absolute;left:9px;right:9px;bottom:9px;height:3px;border-radius:99px;background:var(--line);box-shadow:0 -47px 0 var(--line);}
  .gacha-machine.is-drawing .gacha-card-back{animation:gachaShuffleBack .54s ease-in-out infinite alternate;}
  .gacha-machine.is-drawing .gacha-card-front{animation:gachaShuffleFront .54s ease-in-out infinite alternate;}
  @keyframes gachaShuffleBack{to{transform:translateX(20px) rotate(8deg) translateY(-4px)}}
  @keyframes gachaShuffleFront{to{transform:translateX(-20px) rotate(-8deg) translateY(4px)}}
  .gacha-status{min-height:20px;color:var(--ink-2);font-size:12px;font-weight:800;margin-bottom:10px;}
  .gacha-results{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:0 0 14px;min-height:0;}
  .gacha-result{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:8px 3px 7px;box-shadow:var(--shadow-sm);opacity:0;transform:translateY(9px) rotate(-2deg) scale(.94);animation:gachaReveal .32s ease-out forwards;}
  .gacha-result canvas{display:block;width:34px;height:34px;image-rendering:pixelated;margin:0 auto 3px;}
  .gacha-result span{display:block;font-size:9.5px;font-weight:800;line-height:1.2;color:var(--ink-2);}
  @keyframes gachaReveal{to{opacity:1;transform:translateY(0) rotate(0) scale(1)}}
  .gacha-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .gacha-draw-btn{border:0;border-radius:14px;padding:12px 8px;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-family:inherit;font-weight:900;cursor:pointer;}
  .gacha-draw-btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:none;}
  .gacha-draw-btn small{display:block;font-size:10px;opacity:.75;margin-top:2px;}
  .gacha-draw-btn:disabled{opacity:.45;cursor:not-allowed;}

  @media (max-width:420px){
    .garden-head{align-items:flex-start;}.garden-actions{flex-direction:column;gap:5px;}.btn-adopt{padding:8px 11px;}.gacha-entry{padding:8px 10px;justify-content:center;}
    .zoo-habitat{height:400px;}.zoo-meter-row{grid-template-columns:1fr;gap:8px;}.species-grid{grid-template-columns:repeat(3,1fr);}
  }

  /* alert modal (schedule reminder) */
  .alert-modal{
    width:100%;max-width:340px;background:var(--surface);border-radius:22px;padding:26px 24px 22px;
    text-align:center;box-shadow:var(--shadow);
  }
  .alert-modal .ic-wrap{
    width:56px;height:56px;border-radius:50%;background:var(--teal-tint);color:var(--teal);
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  }
  .alert-modal h3{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:0 0 6px;}
  .alert-modal p{color:var(--ink-2);font-weight:700;font-size:14px;margin:0 0 18px;}

  /* milestone modal */
  .milestone-modal{
    width:100%;max-width:320px;background:var(--surface);border-radius:24px;padding:30px 22px 24px;
    text-align:center;box-shadow:var(--shadow);
  }
  .milestone-modal .badge{
    width:80px;height:80px;border-radius:50%;margin:0 auto 16px;
    background:conic-gradient(from 180deg,var(--gold),var(--accent),var(--gold));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:22px;
    font-family:'Fraunces',serif;box-shadow:0 10px 24px -8px rgba(191,164,106,.5);
    font-variant-numeric:tabular-nums;
  }
  .milestone-modal h3{font-family:'Fraunces',serif;font-size:21px;margin:0 0 6px;font-weight:600;}
  .milestone-modal p{color:var(--ink-2);font-weight:700;font-size:14px;margin:0 0 18px;}

  .toast-wrap{position:fixed;top:16px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:120;pointer-events:none;}
  .toast{
    background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;font-size:13px;
    box-shadow:var(--shadow-sm);opacity:0;transform:translateY(-8px);transition:all .25s ease;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  #confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:130;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important;}
  }
</style>
</head>
<body>

<div class="app-shell">
  <header class="app-header">
  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">每日List</span>
      <span class="brand-sub" id="today-label"></span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="theme-btn" type="button" title="切换到夜间模式" aria-label="切换到夜间模式">
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.2 8.2 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="bell-btn" title="开启到点提醒通知">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M9.5 20a2.5 2.5 0 0 0 5 0"/></svg>
      </button>
    </div>
  </div>
  <div class="stat-row">
    <div class="streak-badge" title="累计完成的重复任务次数">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1-.4-2-1-3 2 1 3 3.5 3 6a8 8 0 1 1-16 0c0-4 3-6 4-8 1-1.5 1.5-2.5 2-2Z" fill="currentColor"/></svg>
      <span id="streak-total">0</span>
    </div>
    <button class="points-badge" id="points-badge-btn" title="积分可以在动物园里领养伙伴和抽取食物">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.9 6.26L21.5 9.3l-4.75 4.4L18 20.5 12 17l-6 3.5 1.25-6.8L2.5 9.3l6.6-1.04L12 2z" fill="currentColor"/></svg>
      <span id="points-total">0</span>
    </button>
  </div>
  </header>

  <!-- TODAY VIEW -->
  <div class="view" id="view-today">
    <div class="section" id="sec-recurring">
      <div class="section-head">重复任务 <span class="count" id="cnt-recurring"></span>
        <button class="sort-icon-btn" id="sort-recurring-btn" data-section="recurring" title="排序方式" aria-label="排序方式">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4M7 4L4 7M7 4l3 3"/><path d="M17 8v12M17 20l3-3M17 20l-3-3"/></svg>
        </button>
      </div>
      <div class="card-list" id="list-recurring"></div>
      <button class="recurring-manage" id="manage-btn">管理重复任务</button>
    </div>
    <div class="section" id="sec-temp">
      <div class="section-head">今日临时任务 <span class="count" id="cnt-temp"></span>
        <button class="sort-icon-btn" id="sort-temp-btn" data-section="temp" title="排序方式" aria-label="排序方式">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4M7 4L4 7M7 4l3 3"/><path d="M17 8v12M17 20l3-3M17 20l-3-3"/></svg>
        </button>
      </div>
      <div class="card-list" id="list-temp"></div>
    </div>
    <div class="section" id="sec-schedule">
      <div class="section-head">
        <span class="schedule-head-title">⏰ 日程 <span class="count" id="cnt-schedule"></span></span>
        <button class="sort-icon-btn schedule-filter-btn" id="schedule-range-btn" type="button" title="筛选日程范围：本周" aria-label="筛选日程范围：本周" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6.2 7.1v5.1l-3.6 1.8v-6.9L4 5z"/></svg>
        </button>
        <button class="sort-icon-btn" id="sort-schedule-btn" data-section="schedule" title="排序方式" aria-label="排序方式">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4M7 4L4 7M7 4l3 3"/><path d="M17 8v12M17 20l3-3M17 20l-3-3"/></svg>
        </button>
      </div>
      <div class="card-list" id="list-schedule"></div>
      <button class="recurring-manage" id="manage-schedule-btn">管理日程</button>
    </div>
  </div>

  <!-- CALENDAR VIEW -->
  <div class="view" id="view-calendar" hidden>
    <div class="cal-head">
      <button class="icon-btn" id="cal-prev">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="cal-month" id="cal-month"></div>
      <button class="icon-btn" id="cal-next">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="weekday-row"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-legend">
      <span class="sw"><span class="dot" style="background:var(--accent-tint);box-shadow:inset 0 0 0 1px var(--accent)"></span>较少</span>
      <span class="sw"><span class="dot" style="background:var(--accent)"></span>充实</span>
      <span class="sw"><span class="dot" style="background:var(--teal)"></span>有日程</span>
      <span class="sw"><span class="dot" style="background:var(--gold)"></span>有日记</span>
    </div>
    <div class="day-summary-card" id="day-summary"></div>
  </div>

  <!-- GARDEN VIEW -->
  <div class="view" id="view-garden" hidden>
    <div class="garden-head">
      <div>
        <div class="garden-title">我的动物园</div>
        <div class="garden-sub">轻点互动，长按可以拎起小动物</div>
      </div>
      <div class="garden-actions">
        <button class="gacha-entry" id="gacha-open-btn" type="button" aria-label="打开抽卡">
          <span class="gacha-entry-icon" aria-hidden="true"></span>
          <span>抽卡</span>
        </button>
        <button class="btn-adopt" id="adopt-open-btn">+ 领养</button>
      </div>
    </div>
    <div class="zoo-habitat" id="zoo-habitat" aria-label="互动动物园">
      <div class="zoo-fence" aria-hidden="true"></div>
      <div id="pet-grid"></div>
    </div>
    <div class="zoo-selected" id="zoo-selected" hidden></div>
  </div>

  <button class="fab" id="fab-add" title="添加任务">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div class="bottom-nav">
    <button class="nav-btn" data-tab="garden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 2 5 5 5 8a5 5 0 0 1-10 0c0-3 2-6 5-8Z"/><path d="M12 21v-7"/></svg>
      <span>动物园</span>
    </button>
    <button class="nav-btn nav-btn-center active" data-tab="today">
      <span class="nav-center-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </span>
      <span>今天</span>
    </button>
    <button class="nav-btn" data-tab="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      <span>日历</span>
    </button>
  </div>

<script>
(function(){
  "use strict";

  /* ---------------- theme ---------------- */
  const THEME_KEY="shiguang_theme_v1";
  const themeBtn=document.getElementById("theme-btn");
  function activeTheme(){
    if(document.documentElement.dataset.theme) return document.documentElement.dataset.theme;
    return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  }
  function updateThemeButton(){
    const isDark=activeTheme()==="dark";
    const label=isDark?"切换到白天模式":"切换到夜间模式";
    themeBtn.title=label;
    themeBtn.setAttribute("aria-label",label);
    themeBtn.setAttribute("aria-pressed",isDark?"true":"false");
  }
  function setTheme(theme){
    document.documentElement.dataset.theme=theme;
    try{ localStorage.setItem(THEME_KEY,theme); }catch(e){ /* ignore storage errors */ }
    updateThemeButton();
  }
  updateThemeButton();
  themeBtn.addEventListener("click",()=>setTheme(activeTheme()==="dark"?"light":"dark"));

  // Keep mobile double-taps from zooming the app while preserving pinch-to-zoom accessibility.
  document.addEventListener("dblclick",(e)=>{
    if(!e.target.closest("input,textarea,[contenteditable='true']")) e.preventDefault();
  },{passive:false});

  /* ---------------- utils ---------------- */
  function pad2(n){return n<10?"0"+n:""+n;}
  function todayStr(){const d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
  function dateStrOf(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
  function timeHM(ts){const d=new Date(ts);return pad2(d.getHours())+":"+pad2(d.getMinutes());}
  function minutesOfHM(hm){const [h,m]=hm.split(":").map(Number);return h*60+m;}
  function fmtMinutes(mins){
    if(mins==null||isNaN(mins)||mins<=0) return "";
    if(mins<60) return mins+"分钟";
    const h=Math.floor(mins/60),m=mins%60;
    return m? (h+"小时"+m+"分钟") : (h+"小时");
  }
  const WEEKDAY=["一","二","三","四","五","六","日"];

  /* ---------------- state ---------------- */
  const STORE_KEY="shiguang_state_v1";
  let state=loadState();

  function defaultState(){
    return { recurring:[], days:{}, pointsSpent:0, pets:[], zooInventory:{apple:1,catstick:0,dogfood:0,feast:0,turtlecalcium:0,bamboo:0,birdseed:0,bone:0}, recycledPets:[], notificationsEnabled:false, scheduleRange:"week", sortMode:{recurring:"custom",temp:"custom",schedule:"time"} };
  }
  function migrateItem(it){
    if(it.priority==null) it.priority=3;
    if(it.createdAt==null) it.createdAt=Date.now();
    if(it.order==null) it.order=it.createdAt;
    return it;
  }
  function loadState(){
    try{
      const raw=localStorage.getItem(STORE_KEY);
      if(!raw) return defaultState();
      const parsed=JSON.parse(raw);
      if(!parsed.recurring) parsed.recurring=[];
      if(!parsed.days) parsed.days={};
      if(typeof parsed.pointsSpent!=="number") parsed.pointsSpent=0;
      if(!parsed.pets) parsed.pets=[];
      if(!parsed.zooInventory) parsed.zooInventory={apple:1};
      if(typeof parsed.zooInventory.feast!=="number") parsed.zooInventory.feast=(parsed.zooInventory.cake||0);
      if(typeof parsed.zooInventory.apple!=="number") parsed.zooInventory.apple=1+(parsed.zooInventory.salad||0);
      ["catstick","dogfood","turtlecalcium","bamboo","birdseed","bone"].forEach(id=>{ if(typeof parsed.zooInventory[id]!=="number") parsed.zooInventory[id]=0; });
      if(!Array.isArray(parsed.recycledPets)) parsed.recycledPets=[];
      const oldSpecies={chick:"bird",cat:"britcat",rabbit:"panda",fox:"shiba",dog:"corgi"};
      parsed.pets.forEach((pet,index)=>{
        pet.species=oldSpecies[pet.species]||pet.species;
        if(typeof pet.satiety!=="number") pet.satiety=Math.max(45,Math.min(100,Number(pet.fed)||45));
        if(typeof pet.mood!=="number") pet.mood=72;
        if(typeof pet.lastUpdatedAt!=="number") pet.lastUpdatedAt=Date.now();
        if(typeof pet.criticalSince!=="number") pet.criticalSince=null;
        if(typeof pet.x!=="number") pet.x=8+(index*23)%72;
        if(typeof pet.y!=="number") pet.y=18+(index*29)%55;
      });
      if(typeof parsed.notificationsEnabled!=="boolean") parsed.notificationsEnabled=false;
      if(!["week","fortnight","month","all"].includes(parsed.scheduleRange)) parsed.scheduleRange="week";
      if(!parsed.sortMode) parsed.sortMode={};
      if(!parsed.sortMode.recurring) parsed.sortMode.recurring="custom";
      if(!parsed.sortMode.temp) parsed.sortMode.temp="custom";
      if(!parsed.sortMode.schedule) parsed.sortMode.schedule="time";
      parsed.recurring.forEach(migrateItem);
      Object.values(parsed.days).forEach(day=>{
        if(!Array.isArray(day.temp)) day.temp=[];
        if(!Array.isArray(day.schedule)) day.schedule=[];
        if(!Array.isArray(day.recurringDone)) day.recurringDone=[];
        if(typeof day.journal!=="string") day.journal="";
        day.temp.forEach(migrateItem);
        day.schedule.forEach(item=>{
          migrateItem(item);
          if(typeof item.hasTime!=="boolean") item.hasTime=!!(item.start&&item.end);
        });
      });
      return parsed;
    }catch(e){ return defaultState(); }
  }
  function saveState(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ /* ignore quota errors */ }
  }
  function ensureDay(dateStr){
    if(!state.days[dateStr]) state.days[dateStr]={temp:[],schedule:[],recurringDone:[],journal:""};
    if(typeof state.days[dateStr].journal!=="string") state.days[dateStr].journal="";
    return state.days[dateStr];
  }
  function carryForwardIncompleteTemps(targetDate){
    const target=ensureDay(targetDate);
    const existingIds=new Set(target.temp.map(task=>task.id));
    let changed=false;
    Object.keys(state.days).filter(date=>date<targetDate).sort().forEach(date=>{
      const source=state.days[date];
      if(!source||!Array.isArray(source.temp)) return;
      const unfinished=source.temp.filter(task=>!task.done);
      if(unfinished.length===0) return;
      source.temp=source.temp.filter(task=>task.done);
      unfinished.forEach(task=>{
        if(existingIds.has(task.id)) return;
        task.carriedFrom=task.carriedFrom||date;
        task.carriedAt=Date.now();
        target.temp.push(task);
        existingIds.add(task.id);
      });
      changed=true;
    });
    if(changed) saveState();
  }

  function dayCompletedCount(day){

    return (day.recurringDone?day.recurringDone.length:0)
      + (day.temp?day.temp.filter(t=>t.done).length:0)
      + (day.schedule?day.schedule.filter(s=>s.done).length:0);
  }
  function totalEarnedPoints(){
    let sum=0;
    Object.values(state.days).forEach(day=>{
      const c=dayCompletedCount(day);
      if(c>=POINTS_THRESHOLD) sum+=c;
    });
    return sum;
  }

  const cctx=confettiCanvas.getContext("2d");
  function resizeCanvas(){ confettiCanvas.width=window.innerWidth; confettiCanvas.height=window.innerHeight; }
  resizeCanvas();

  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let particles=[];

  const CONFETTI_COLORS=["#7E8C6C","#C79B6E","#A98B8B","#BFA46A","#E4DCC8"];
  function burstConfetti(big){
    if(reduceMotion) return;
    const count = big? 160 : 60;
    const originX = confettiCanvas.width/2;
    const originY = big? confettiCanvas.height*0.35 : confettiCanvas.height*0.28;
    for(let i=0;i<count;i++){
      const angle = big ? (Math.random()*Math.PI*2) : (Math.random()*Math.PI - Math.PI*1.5);
      const speed = big? (4+Math.random()*9) : (3+Math.random()*6);
      particles.push({
        x: big? originX + (Math.random()-0.5)*40 : Math.random()*confettiCanvas.width,
        y: big? originY : -10-Math.random()*40,
        vx: big? Math.cos(angle)*speed : (Math.random()-0.5)*3,
        vy: big? Math.sin(angle)*speed : 2+Math.random()*3,
        size: 5+Math.random()*6,
        color: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
        rot: Math.random()*Math.PI,
        vr: (Math.random()-0.5)*0.3,
        life: 0,
        maxLife: 70+Math.random()*50
      });
    }
    if(!confettiRAF) tickConfetti();
  }
  function tickConfetti(){
    cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    particles.forEach(p=>{
      p.vy+=0.14;
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++;
      cctx.save();
      cctx.globalAlpha=Math.max(0,1-p.life/p.maxLife);
      cctx.translate(p.x,p.y);
      cctx.rotate(p.rot);
      cctx.fillStyle=p.color;
      cctx.fillRect(-p.size/2,-p.size/3,p.size,p.size*0.66);
      cctx.restore();
    });
    particles=particles.filter(p=>p.life<p.maxLife && p.y<confettiCanvas.height+40);
    if(particles.length>0){ confettiRAF=requestAnimationFrame(tickConfetti); }
    else { confettiRAF=null; cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); }
  }

  let audioCtx=null;
  function getAudioCtx(){

  function playChime(big){
    const ctx=getAudioCtx();
    if(!ctx) return;
    if(ctx.state==="suspended") ctx.resume();
    const notes = big? [523.25,659.25,783.99,1046.5] : [659.25,987.77];
    const now=ctx.currentTime;
    notes.forEach((freq,i)=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type="sine";
      osc.frequency.value=freq;
      const t0=now+i*(big?0.11:0.09);
      gain.gain.setValueAtTime(0.0001,t0);
      gain.gain.exponentialRampToValueAtTime(big?0.16:0.13,t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001,t0+(big?0.5:0.32));
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0+(big?0.55:0.35));
    });
  }
  function playAlertTone(){
    const ctx=getAudioCtx();
    if(!ctx) return;
    if(ctx.state==="suspended") ctx.resume();
    const now=ctx.currentTime;
    [0,0.28].forEach(off=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type="triangle";
      osc.frequency.value=880;
      gain.gain.setValueAtTime(0.0001,now+off);
      gain.gain.exponentialRampToValueAtTime(0.18,now+off+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+off+0.24);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now+off);
      osc.stop(now+off+0.26);
    });
  }

  function enableDragReorder(listEl,kind){
    listEl.querySelectorAll(".drag-handle").forEach(handle=>{
      let longPressTimer=null;
      let dragging=false;
      let startY=0;
      let card=null;

      function onMove(ev){
        if(!dragging||!card) return;
        ev.preventDefault();
        const deltaY=ev.clientY-startY;
        card.style.transform="translateY("+deltaY+"px)";
        const siblings=[...listEl.querySelectorAll(".item-card")].filter(c=>c!==card);
        let refNode=null;
        for(const sib of siblings){
          const rect=sib.getBoundingClientRect();
          if(ev.clientY<rect.top+rect.height/2){ refNode=sib; break; }
        }
        if(refNode){
          if(refNode!==card.nextElementSibling && refNode!==card){
            listEl.insertBefore(card,refNode);
            card.style.transform="translateY(0px)";
            startY=ev.clientY;
          }
        }else if(listEl.lastElementChild!==card){
          listEl.appendChild(card);
          card.style.transform="translateY(0px)";
          startY=ev.clientY;
        }
      }
      function onUp(ev){
        clearTimeout(longPressTimer);
        window.removeEventListener("pointermove",onMove);
        window.removeEventListener("pointerup",onUp);
        if(dragging && card){
          card.classList.remove("dragging");
          card.style.transform="";
          commitOrder(listEl,kind);
        }
        dragging=false; card=null;
      }
      handle.addEventListener("pointerdown",(e)=>{
        card=handle.closest(".item-card");
        if(!card) return;
        startY=e.clientY;
        window.addEventListener("pointermove",onMove);
        window.addEventListener("pointerup",onUp);
        longPressTimer=setTimeout(()=>{
          dragging=true;
          card.classList.add("dragging");
        },320);
      });
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function hasConflict(dateStr,start,end,excludeId){
    const day=state.days[dateStr]||{schedule:[]};
    const s1=minutesOfHM(start), e1=minutesOfHM(end);
    return day.schedule.some(o=>{
      if(o.id===excludeId) return false;
      const s2=minutesOfHM(o.start), e2=minutesOfHM(o.end);
      return s1<e2 && s2<e1;
    });
  }
  function conflictList(dateStr,start,end,excludeId){
    const day=state.days[dateStr]||{schedule:[]};
    const s1=minutesOfHM(start), e1=minutesOfHM(end);
    return day.schedule.filter(o=>{
      if(excludeId instanceof Set?excludeId.has(o.id):o.id===excludeId) return false;
      const s2=minutesOfHM(o.start), e2=minutesOfHM(o.end);
      return s1<e2 && s2<e1;
    });
  }

  function fmtShortDate(dateStr){
    const [y,m,d]=dateStr.split("-").map(Number);
    return m+"月"+d+"日";

  function fmtFullDate(dateStr){
    const [y,m,d]=dateStr.split("-").map(Number);
    const obj=new Date(y,m-1,d);
    return y+"年"+m+"月"+d+"日 · 周"+WEEKDAY[(obj.getDay()+6)%7];

      items.push(task?task.name:"已删除的重复任务");

    (day.temp||[]).filter(task=>task.done).forEach(task=>items.push(task.name));

  function dateTimeMs(dateStr,hm){
    const [y,m,d]=dateStr.split("-").map(Number);

  function collectAllSchedules(){
    const list=[];
    Object.keys(state.days).forEach(dateStr=>{
      const day=state.days[dateStr];
      if(!day.schedule) return;
      day.schedule.forEach(s=>{
        const hasTime=s.hasTime!==false&&!!s.start&&!!s.end;
        list.push(Object.assign({},s,{date:dateStr,hasTime,startMs:dateTimeMs(dateStr,hasTime?s.start:"00:00"),endMs:dateTimeMs(dateStr,hasTime?s.end:"23:59")}));
      });
    });
    return list;
  }
  function upcomingSchedules(){
    const today=todayStr();
    const now=Date.now();
    return collectAllSchedules()
      .filter(s=>s.date===today || s.startMs>now)
      .sort((a,b)=>a.startMs-b.startMs);
  }
  function selectedScheduleRangeEnd(){
    if(state.scheduleRange==="all") return null;
    const now=new Date();
    const end=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    if(state.scheduleRange==="week"){
      const mondayIndex=(end.getDay()+6)%7;
      end.setDate(end.getDate()+(6-mondayIndex));
    }else if(state.scheduleRange==="fortnight"){
      end.setDate(end.getDate()+13);
    }else{
      // Keep a full rolling-month window so schedules do not vanish near month end.
      end.setDate(end.getDate()+30);
    }
    return dateStrOf(end);
  }
  function schedulesForSelectedRange(){
    const endDate=selectedScheduleRangeEnd();
    if(!endDate) return upcomingSchedules();
    return upcomingSchedules().filter(schedule=>schedule.date<=endDate);

  function findScheduleEntry(id){
    for(const dateStr of Object.keys(state.days)){
      const day=state.days[dateStr];
      if(!day.schedule) continue;
      const item=day.schedule.find(s=>s.id===id);
      if(item) return {day,item,date:dateStr};
    }
    return null;
  }
  function countdownText(startMs,endMs){
    const now=Date.now();
    if(now<startMs){
      const diff=startMs-now;
      const days=Math.floor(diff/86400000);
      const hours=Math.floor((diff%86400000)/3600000);
      const mins=Math.floor((diff%3600000)/60000);
      if(days>0) return "还有"+days+"天"+hours+"小时";
      if(hours>0) return "还有"+hours+"小时"+mins+"分钟";
      return "还有"+mins+"分钟";
    }else if(now<endMs){
      return "进行中";
    }
    return "已结束";
  }
  function tickCountdowns(){
    document.querySelectorAll(".meta-countdown").forEach(el=>{

    });

  function toggleRecurring(id){
    const today=todayStr();
    const day=ensureDay(today);
    const tpl=state.recurring.find(r=>r.id===id);
    if(!tpl) return;
    const idx=day.recurringDone.findIndex(x=>x.templateId===id);
    if(idx>=0){
      day.recurringDone.splice(idx,1);
      tpl.total=Math.max(0,(tpl.total||0)-1);
    }else{
      day.recurringDone.push({templateId:id,minutes:null,completedAt:Date.now()});
      tpl.total=(tpl.total||0)+1;
      const milestone=checkMilestone(tpl.total,tpl.name);
      if(!milestone) celebrate(false);
    }
    saveState(); renderToday(); if(currentTab==="calendar") renderCalendar();
  }

  function toggleTemp(id){
    const today=todayStr();
    const day=ensureDay(today);
    const t=day.temp.find(x=>x.id===id);
    if(!t) return;
    t.done=!t.done;
    if(t.done){ t.completedAt=Date.now(); celebrate(false); }
    saveState(); renderToday(); if(currentTab==="calendar") renderCalendar();
  }

  function toggleSchedule(id){
    const found=findScheduleEntry(id);
    if(!found) return;
    const s=found.item;
    s.done=!s.done;
    if(s.done){ s.completedAt=Date.now(); celebrate(false); }
    saveState(); renderToday(); if(currentTab==="calendar") renderCalendar();
  }

  function deleteTemp(id){
    const today=todayStr();
    const day=ensureDay(today);
    day.temp=day.temp.filter(t=>t.id!==id);
    saveState(); renderToday();
  }
  function deleteSchedule(id){
    const found=findScheduleEntry(id);
    if(!found) return;
    found.day.schedule=found.day.schedule.filter(s=>s.id!==id);
    saveState(); renderToday(); if(currentTab==="calendar") renderCalendar();

  function scheduleManagementGroups(){
    const groups=new Map();
    Object.keys(state.days).sort().forEach(date=>{
      const day=state.days[date];
      (day.schedule||[]).forEach(item=>{
        const key=item.recurrenceGroupId?"group:"+item.recurrenceGroupId:"item:"+item.id;
        if(!groups.has(key)) groups.set(key,{key,groupId:item.recurrenceGroupId||null,occurrences:[]});
        groups.get(key).occurrences.push({date,item});
      });
    });
    return [...groups.values()].map(group=>{
      group.occurrences.sort((a,b)=>a.date.localeCompare(b.date));
      group.first=group.occurrences[0];
      group.last=group.occurrences[group.occurrences.length-1];
      return group;
    }).sort((a,b)=>a.first.date.localeCompare(b.first.date));
  }
  function removeScheduleGroup(group){
    const ids=new Set(group.occurrences.map(entry=>entry.item.id));
    Object.values(state.days).forEach(day=>{
      day.schedule=(day.schedule||[]).filter(item=>!ids.has(item.id));

    renderToday();

    renderManageScheduleList();

      if(!held) return;
      if(navigator.vibrate) navigator.vibrate(18);

  /* ---------------- minutes popover ---------------- */
  let activePopover=null;
  function closePopover(){ if(activePopover){ activePopover.remove(); activePopover=null; } }
  function openMinutesPopover(anchor,kind,id){
    closePopover();
    const rect=anchor.getBoundingClientRect();
    const pop=document.createElement("div");
    pop.className="popover";
    const presets=[15,30,45,60,90,120];
    pop.innerHTML = presets.map(m=>`<button class="chip" data-m="${m}">${fmtMinutes(m)}</button>`).join("")
      + '<button class="chip" data-m="custom">自定义</button>'
      + '<button class="chip" data-m="0">清除</button>';
    document.body.appendChild(pop);
    const top=Math.min(rect.top+window.scrollY, window.scrollY+window.innerHeight-220);
    pop.style.top=Math.max(10,top)+"px";
    let left=rect.left+window.scrollX-190;
    if(left<10) left=10;
    pop.style.left=left+"px";
    activePopover=pop;
    pop.addEventListener("click",(e)=>{
      const c=e.target.closest("button");
      if(!c) return;
      let val=c.dataset.m;
      if(val==="custom"){
        closePopover();
        openCustomDurationEditor(kind,id);
        return;
      }
      const n=parseInt(val,10);
      applyMinutes(kind,id,n>0?n:null);
      closePopover();
    });
    setTimeout(()=>{
      document.addEventListener("click",outsidePopover,{capture:true});
    },0);
  }
  function outsidePopover(e){
    if(activePopover && !activePopover.contains(e.target)){
      closePopover();
      document.removeEventListener("click",outsidePopover,{capture:true});
    }
  }
  const customDurationBackdrop=document.getElementById("custom-duration-backdrop");
  const customDurationValue=document.getElementById("custom-duration-value");
  const customDurationUnit=document.getElementById("custom-duration-unit");
  let customDurationKind=null;

  function currentMinutesValue(kind,id){

    if(kind==="recurring"){
      const item=day.recurringDone.find(entry=>entry.templateId===id);
      return item&&item.minutes||0;

  function applyMinutes(kind,id,mins){

  function dayScore(dateStr){
    const day=state.days[dateStr];
    if(!day) return {score:0,hasSchedule:false,hasJournal:false};
    const score=(day.recurringDone?day.recurringDone.length:0)
      + (day.temp?day.temp.filter(t=>t.done).length:0)
      + (day.schedule?day.schedule.filter(s=>s.done).length:0);
    const hasSchedule = day.schedule && day.schedule.length>0;
    const hasJournal = !!(day.journal&&day.journal.trim());
    return {score,hasSchedule,hasJournal};
  }

  function renderCalendar(){
    document.getElementById("cal-month").textContent = calCursor.getFullYear()+"年"+(calCursor.getMonth()+1)+"月";
    const grid=document.getElementById("cal-grid");
    grid.innerHTML="";
    const year=calCursor.getFullYear(), month=calCursor.getMonth();
    const firstDay=new Date(year,month,1);
    const startOffset=(firstDay.getDay()+6)%7; // Monday=0
    const daysInMonth=new Date(year,month+1,0).getDate();
    const today=todayStr();

    for(let i=0;i<startOffset;i++){
      const pad=document.createElement("div");
      pad.className="cal-cell pad";
      grid.appendChild(pad);
    }
    for(let d=1; d<=daysInMonth; d++){
      const dateStr=year+"-"+pad2(month+1)+"-"+pad2(d);
      const {score,hasSchedule,hasJournal}=dayScore(dateStr);
      const cell=document.createElement("button");
      cell.className="cal-cell"+(dateStr===today?" today":"");
      let bg="var(--surface)", fg="var(--ink)";
      if(score>=5){ bg="var(--accent)"; fg="#fff"; }
      else if(score>=3){ bg="var(--accent-tint)"; }
      else if(score>=1){ bg="var(--surface-soft)"; }
      cell.style.background=bg;
      cell.style.color=fg;
      cell.innerHTML=`${d}<span class="dots">${hasSchedule?"<i></i>":""}${hasJournal?'<i class="journal-dot"></i>':""}</span>`;
      cell.addEventListener("click",()=>renderDayDetail(dateStr));
      grid.appendChild(cell);
    }
    renderDayDetail(today);
  }
  document.getElementById("cal-prev").addEventListener("click",()=>{ calCursor.setMonth(calCursor.getMonth()-1); renderCalendar(); });
  document.getElementById("cal-next").addEventListener("click",()=>{ calCursor.setMonth(calCursor.getMonth()+1); renderCalendar(); });

  function renderDayDetail(dateStr){
    const box=document.getElementById("day-summary");
    const day=state.days[dateStr] || {temp:[],schedule:[],recurringDone:[],journal:""};
    const parts=dateStr.split("-").map(Number);
    const dObj=new Date(parts[0],parts[1]-1,parts[2]);
    const label=(parts[1])+"月"+parts[2]+"日 · 周"+WEEKDAY[(dObj.getDay()+6)%7];

    const entries=[];
    day.schedule.forEach(s=>{
      const hasTime=s.hasTime!==false&&!!s.start&&!!s.end;
      const dur=hasTime?minutesOfHM(s.end)-minutesOfHM(s.start):0;
      entries.push({t:hasTime?minutesOfHM(s.start):0, timeLabel:hasTime?"":"—", name:s.name, sub:(hasTime?s.start+"–"+s.end:"未设置时间")+(s.done?" · 已完成":""), color:"var(--teal)", minutes: dur>0?dur:0});
    });
    day.recurringDone.forEach(r=>{
      const tpl=state.recurring.find(x=>x.id===r.templateId);
      const t=new Date(r.completedAt);
      entries.push({t:t.getHours()*60+t.getMinutes(), name:(tpl?tpl.name:"（已删除的任务）")+" ✓", sub: r.minutes? fmtMinutes(r.minutes):"重复任务打卡", color:"var(--accent)", minutes:r.minutes||0});

    day.temp.filter(x=>x.done).forEach(x=>{

      '<div class="journal-actions"><button class="btn btn-primary" type="button" data-save-day-journal>保存这天日记</button></div>'+

  function buildScheduleOccurrencePlan(){
    if(!fDate.value) return {dates:[],error:"请选择开始日期"};
    if(repeatMode==="none") return {dates:[fDate.value],error:""};
    if(!fRepeatUntil.value) return {dates:[],error:"请选择循环结束日期"};
    const start=dateFromStr(fDate.value), end=dateFromStr(fRepeatUntil.value);
    if(end<start) return {dates:[],error:"循环结束日期不能早于开始日期"};
    const span=Math.round((end-start)/86400000);
    if(span>1095) return {dates:[],error:"循环区间最长支持3年"};
    if(repeatMode==="weekly"&&selectedRepeatWeekdays.size===0) return {dates:[],error:"请至少选择一个星期"};
    const dates=[];
    const cursor=new Date(start);
    while(cursor<=end){
      const weekday=cursor.getDay()===0?7:cursor.getDay();
      if(repeatMode==="daily"||selectedRepeatWeekdays.has(weekday)) dates.push(dateStrOf(cursor));
      if(dates.length>366) return {dates:[],error:"单次最多创建366次循环日程"};
      cursor.setDate(cursor.getDate()+1);
    }
    if(dates.length===0) return {dates:[],error:"当前设置没有可创建的日期"};
    return {dates,error:""};
  }

  function checkConflictPreview(){

    const plan=buildScheduleOccurrencePlan();
    if(plan.error){
      conflictHint.hidden=false;

      conflictHint.hidden=true;

  }

  function dateFromStr(value){

  function sameCalendarDay(a,b){

  function renderDatePicker(){

    const first=new Date(year,month,1);
    const leading=(first.getDay()+6)%7;

    const today=dateFromStr(todayStr());
    let html="";
    for(let i=0;i<leading;i++) html+='<button class="date-day pad" tabindex="-1"></button>';
    for(let day=1;day<=days;day++){
      const value=dateStrOf(new Date(year,month,day));
      const current=new Date(year,month,day);
      const classes=["date-day"];
      if(sameCalendarDay(current,today)) classes.push("today");
      if(sameCalendarDay(current,datePickerSelected)) classes.push("selected");
      html+='<button type="button" class="'+classes.join(" ")+'" data-date="'+value+'">'+day+'</button>';
    }
    datePickerGrid.innerHTML=html;

  const WHEEL_ITEM_H=40;
  const wheelHourEl=document.getElementById("wheel-hour");
  const wheelMinuteEl=document.getElementById("wheel-minute");
  const wheelAmpmEl=document.getElementById("wheel-ampm");
  let wheelTargetBtn=null, wheelTargetInput=null;

  function buildWheelColumn(el,labels){
    el.innerHTML='<div class="wheel-pad"></div>'+
      labels.map(l=>'<div class="wheel-item">'+l+'</div>').join("")+
      '<div class="wheel-pad"></div>';
  }
  buildWheelColumn(wheelHourEl, Array.from({length:12},(_,i)=>String(i+1)));
  buildWheelColumn(wheelMinuteEl, Array.from({length:60},(_,i)=>pad2(i)));
  buildWheelColumn(wheelAmpmEl, ["上午","下午"]); // fixed order: 上午 always above 下午

  function wheelSelectedIndex(el){
    return Math.round(el.scrollTop/WHEEL_ITEM_H);
  }
  function wheelSetIndex(el,idx,smooth){
    el.scrollTo({top:idx*WHEEL_ITEM_H, behavior:smooth?"smooth":"auto"});
  }
  function refreshWheelHighlight(el){
    const idx=wheelSelectedIndex(el);
    const items=el.querySelectorAll(".wheel-item");
    items.forEach((it,i)=>it.classList.toggle("selected",i===idx));
  }
  [wheelHourEl,wheelMinuteEl,wheelAmpmEl].forEach(el=>{
    el.addEventListener("scroll",()=>refreshWheelHighlight(el));
    el.addEventListener("click",(e)=>{
      const item=e.target.closest(".wheel-item");
      if(!item) return;
      const items=[...el.querySelectorAll(".wheel-item")];
      wheelSetIndex(el, items.indexOf(item), true);
    });
  });

  function openTimeWheel(kind){
    wheelTargetBtn = kind==="start" ? fStartBtn : fEndBtn;
    wheelTargetInput = kind==="start" ? fStart : fEnd;
    document.getElementById("time-wheel-title").textContent = kind==="start" ? "选择开始时间" : "选择结束时间";
    let h24=9, m=0;
    if(wheelTargetInput.value){
      const parts=wheelTargetInput.value.split(":").map(Number);
      h24=parts[0]; m=parts[1];
    }
    const isPM = h24>=12;
    let h12 = h24%12; if(h12===0) h12=12;
    wheelSetIndex(wheelHourEl, h12-1, false);
    wheelSetIndex(wheelMinuteEl, m, false);

  function replaceEditedSchedule(name,now,plan,leadMinutes){
    const group=scheduleManagementGroups().find(entry=>entry.key===editingScheduleKey);
    if(!group){ toast("没有找到要编辑的日程"); return false; }
    const oldByDate=new Map(group.occurrences.map(entry=>[entry.date,entry.item]));
    const oldIds=new Set(group.occurrences.map(entry=>entry.item.id));
    Object.values(state.days).forEach(day=>{
      day.schedule=(day.schedule||[]).filter(item=>!oldIds.has(item.id));
    });
    const groupId=repeatMode==="none"?null:(group.groupId||uid());
    const weekdays=[...selectedRepeatWeekdays].sort((a,b)=>a-b);
    plan.dates.forEach((date,index)=>{
      const old=oldByDate.get(date);
      const hasTime=fTimeEnable.checked;
      const sameTiming=old&&old.hasTime===hasTime&&old.start===(hasTime?fStart.value:"")&&old.end===(hasTime?fEnd.value:"")&&Number(old.leadMinutes||0)===Number(leadMinutes||0);
      ensureDay(date).schedule.push({
        id:old?old.id:uid(),name,date,start:hasTime?fStart.value:"",end:hasTime?fEnd.value:"",hasTime,
        leadMinutes,done:old?!!old.done:false,
        completedAt:old?old.completedAt||null:null,
        notifiedLead:sameTiming?!!old.notifiedLead:false,
        notifiedOnTime:sameTiming?!!old.notifiedOnTime:false,
        createdAt:old?old.createdAt||now:now,order:old?old.order||now+index:now+index,priority:selectedPriority,
        recurrenceGroupId:groupId,recurrenceMode:repeatMode,
        recurrenceUntil:repeatMode==="none"?null:fRepeatUntil.value,
        recurrenceWeekdays:repeatMode==="weekly"?weekdays:[]
      });
    });
    saveState();
    editingScheduleKey=null;
    addBackdrop.classList.remove("editing-layer");
    closeBackdrop("add-backdrop");
    renderToday();
    if(currentTab==="calendar") renderCalendar();
    renderManageScheduleList();
    toast("日程已更新");
    return true;
  }
