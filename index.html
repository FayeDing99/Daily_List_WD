  function applyPetDecay(){
    const now=Date.now();let changed=false;const recycled=[];
    state.pets.forEach(pet=>{
      const hours=Math.max(0,(now-(pet.lastUpdatedAt||now))/3600000);
      if(hours>.01){
        const before=pet.satiety;
        pet.satiety=clampPetValue((pet.satiety||0)-hours*HUNGER_PER_HOUR);
        if(pet.satiety<25) pet.mood=clampPetValue((pet.mood||0)-hours*.35);
        pet.lastUpdatedAt=now;
        if(Math.abs(before-pet.satiety)>.01) changed=true;
      }
      if(pet.satiety<=0){
        pet.satiety=0;
        if(!pet.criticalSince){pet.criticalSince=now;changed=true;}
        else if(now-pet.criticalSince>=CRITICAL_GRACE_MS) recycled.push(pet);
      }else if(pet.criticalSince){pet.criticalSince=null;changed=true;}
    });
    if(recycled.length){
      const ids=new Set(recycled.map(p=>p.id));
      recycled.forEach(p=>state.recycledPets.push({id:p.id,species:p.species,recycledAt:now}));
      state.pets=state.pets.filter(p=>!ids.has(p.id));
      if(ids.has(selectedPetId)) selectedPetId=null;
      changed=true;toast(recycled.length+"只小动物已由管理员接回保育中心");
    }
    if(changed) saveState();
  }

  function petStateLabel(pet){
    if(pet.satiety<=0){
      const hours=Math.max(0,Math.ceil((CRITICAL_GRACE_MS-(Date.now()-(pet.criticalSince||Date.now())))/3600000));
      return "濒危期 · "+hours+"小时内可投喂救回";
    }
    if(pet.satiety<25) return "肚子饿了";
    if(pet.mood>=80) return "心情很好";
    if(pet.mood<40) return "有点低落";
    return "正在悠闲散步";
  }

        <canvas class="zoo-pet-canvas" data-species="${sp.id}"></canvas>
        <span class="zoo-pet-name">${sp.name}</span>
        <span class="zoo-pet-mood">${pet.satiety<25?"饿饿":"开心"}</span>
      </button>`;
    }).join("");
    grid.querySelectorAll(".zoo-pet").forEach(btn=>{
      const pet=state.pets.find(p=>p.id===btn.dataset.id);
      drawPetSprite(btn.querySelector("canvas"),pet.species,pet.satiety<25?"hungry":"neutral");
      bindZooPet(btn,pet);
    });
    if(!selectedPetId||!state.pets.some(p=>p.id===selectedPetId)) selectedPetId=state.pets[0].id;
    renderSelectedPet();
    ensureZooLoops();
  }

  function tapZooPet(btn,pet){
    selectedPetId=pet.id;pet.mood=clampPetValue(pet.mood+1);saveState();
    btn.classList.remove("is-bouncing");void btn.offsetWidth;btn.classList.add("is-bouncing","show-mood");
    btn.querySelector(".zoo-pet-mood").textContent=pet.satiety<25?"饿饿":"啵！";
    drawPetSprite(btn.querySelector("canvas"),pet.species,"happy");
    setTimeout(()=>{btn.classList.remove("is-bouncing","show-mood");drawPetSprite(btn.querySelector("canvas"),pet.species,pet.satiety<25?"hungry":"neutral");},900);
    renderSelectedPet();
  }

  function bindZooPet(btn,pet){
    let holdTimer=null;let dragging=false;let pointerId=null;
    btn.addEventListener("contextmenu",e=>e.preventDefault());
    btn.addEventListener("pointerdown",e=>{
      pointerId=e.pointerId;btn.setPointerCapture(pointerId);
      holdTimer=setTimeout(()=>{
        dragging=true;zooDraggingPetId=pet.id;btn.classList.add("is-dragging","is-held","show-mood");
        btn.querySelector(".zoo-pet-mood").textContent="拎起来啦";
      },430);
    });
    btn.addEventListener("pointermove",e=>{
      if(!dragging||e.pointerId!==pointerId) return;
      const habitat=document.getElementById("zoo-habitat");const rect=habitat.getBoundingClientRect();
      pet.x=Math.max(0,Math.min(100,(e.clientX-rect.left-45)/(rect.width-90)*100));
      pet.y=Math.max(4,Math.min(82,(e.clientY-rect.top-45)/(rect.height-112)*100));
      btn.style.left=pet.x+"%";btn.style.top=pet.y+"%";
    });
    function finish(e){
      if(e.pointerId!==pointerId) return;clearTimeout(holdTimer);
      if(dragging){
        dragging=false;zooDraggingPetId=null;btn.classList.remove("is-dragging","is-held","show-mood");saveState();
        btn.classList.add("is-bouncing");setTimeout(()=>btn.classList.remove("is-bouncing"),400);
      }else tapZooPet(btn,pet);
      pointerId=null;
    }
    btn.addEventListener("pointerup",finish);btn.addEventListener("pointercancel",finish);
  }

  function ensureZooLoops(){
    if(!zooMotionTimer){
      zooMotionTimer=setInterval(()=>{
        if(currentTab!=="garden"||zooDraggingPetId||state.pets.length===0) return;
        const pet=state.pets[Math.floor(Math.random()*state.pets.length)];
        const btn=document.querySelector('.zoo-pet[data-id="'+pet.id+'"]');if(!btn) return;
        const nextX=4+Math.random()*82,nextY=13+Math.random()*60;
        btn.style.setProperty("--pet-facing",nextX<pet.x?-1:1);pet.x=nextX;pet.y=nextY;
        btn.style.left=pet.x+"%";btn.style.top=pet.y+"%";
        const expression=pet.satiety<25?"hungry":(Math.random()<.55?"blink":"happy");
        drawPetSprite(btn.querySelector("canvas"),pet.species,expression);btn.classList.add("show-mood");
        btn.querySelector(".zoo-pet-mood").textContent=pet.satiety<25?"想吃饭":"悠闲";
        setTimeout(()=>{if(btn.isConnected){btn.classList.remove("show-mood");drawPetSprite(btn.querySelector("canvas"),pet.species,pet.satiety<25?"hungry":"neutral");}},900);
        saveState();
      },4200);
    }
    if(!zooDecayTimer){
      zooDecayTimer=setInterval(()=>{if(currentTab==="garden") renderGarden();else applyPetDecay();},60000);
    }
  }

  function renderSelectedPet(){
    const panel=document.getElementById("zoo-selected");const pet=state.pets.find(p=>p.id===selectedPetId);
    if(!pet){panel.hidden=true;return;}panel.hidden=false;
    const sp=SPECIES.find(s=>s.id===pet.species)||SPECIES[0];const critical=pet.satiety<=0;
    panel.innerHTML=`<div class="zoo-selected-head"><div><div class="zoo-selected-name">${sp.name}</div><div class="zoo-selected-state${critical?" zoo-critical":""}">${petStateLabel(pet)}</div></div><button class="btn-adopt btn-zoo-secondary" id="zoo-detail-btn">查看详情</button></div>
      <div class="zoo-meter-row"><div><div class="zoo-meter-label"><span>饱腹</span><span>${Math.round(pet.satiety)}</span></div><div class="zoo-meter hunger"><i style="width:${pet.satiety}%"></i></div></div><div><div class="zoo-meter-label"><span>心情</span><span>${Math.round(pet.mood)}</span></div><div class="zoo-meter mood"><i style="width:${pet.mood}%"></i></div></div></div>
      <div class="zoo-food-row">${FOODS.filter(food=>canPetEatFood(pet,food)).map(food=>`<button class="zoo-food-btn" data-feed="${food.id}" ${(state.zooInventory[food.id]||0)<1?"disabled":""}><canvas class="zoo-food-icon" data-food="${food.id}"></canvas><span>${food.name} · ${state.zooInventory[food.id]||0}</span></button>`).join("")}</div>`;
    drawFoodIcons(panel);
    panel.querySelector("#zoo-detail-btn").addEventListener("click",()=>openFeedSheet(pet.id));
    panel.querySelectorAll("[data-feed]").forEach(btn=>btn.addEventListener("click",()=>feedPet(pet.id,btn.dataset.feed)));
  }

  function feedPet(petId,foodId){
    const pet=state.pets.find(p=>p.id===petId),food=FOODS.find(f=>f.id===foodId);if(!pet||!food) return;
    if(!canPetEatFood(pet,food)){toast("这份食物不适合"+(SPECIES.find(s=>s.id===pet.species)||SPECIES[0]).name);return;}
    if((state.zooInventory[food.id]||0)<1){toast("背包里没有这种食物啦");return;}
    state.zooInventory[food.id]-=1;pet.satiety=clampPetValue(pet.satiety+food.satiety);pet.mood=clampPetValue(pet.mood+food.mood);pet.criticalSince=null;pet.lastUpdatedAt=Date.now();saveState();
    const btn=document.querySelector('.zoo-pet[data-id="'+pet.id+'"]');
    if(btn){btn.classList.add("is-eating","show-mood");btn.querySelector(".zoo-pet-mood").textContent="好吃";drawPetSprite(btn.querySelector("canvas"),pet.species,"happy");setTimeout(()=>{btn.classList.remove("is-eating","show-mood");drawPetSprite(btn.querySelector("canvas"),pet.species,"neutral");},1300);}
    toast("饱腹 +"+food.satiety+"，心情 +"+food.mood);renderSelectedPet();
    if(feedingPetId===pet.id) renderFeedSheet();
  }

  /* adopt */
  const adoptBackdrop=document.getElementById("adopt-backdrop");
  document.getElementById("adopt-open-btn").addEventListener("click",()=>{
    document.getElementById("adopt-cost-label").textContent=ADOPT_COST;
    renderSpeciesGrid();
    openBackdrop("adopt-backdrop");
  });
  document.getElementById("adopt-close-btn").addEventListener("click",()=>closeBackdrop("adopt-backdrop"));
  adoptBackdrop.addEventListener("click",(e)=>{ if(e.target===adoptBackdrop) closeBackdrop("adopt-backdrop"); });

  function renderSpeciesGrid(){
    const grid=document.getElementById("species-grid");
    const owned=new Set(state.pets.map(p=>p.species));
    const balance=pointsBalance();
    grid.innerHTML=SPECIES.map(sp=>{
      const isOwned=owned.has(sp.id);
      const canAfford=balance>=ADOPT_COST;
      const cls="species-opt"+(isOwned?" owned":(canAfford?"":" disabled"));
      return `<button class="${cls}" data-id="${sp.id}" ${isOwned?"disabled":""}>
        <canvas data-species="${sp.id}"></canvas>
        <span class="s-name">${isOwned?"已拥有":sp.name}</span>
      </button>`;
    }).join("");
    grid.querySelectorAll("canvas[data-species]").forEach(canvas=>drawPetSprite(canvas,canvas.dataset.species));
    grid.querySelectorAll(".species-opt:not(.owned)").forEach(btn=>{
      btn.addEventListener("click",()=>{
        if(pointsBalance()<ADOPT_COST){ toast("积分不够啦，再完成几件任务吧"); return; }
        const sp=SPECIES.find(s=>s.id===btn.dataset.id);
        if(!spendPoints(ADOPT_COST)) return;
        const pet={id:uid(),species:sp.id,satiety:75,mood:80,lastUpdatedAt:Date.now(),criticalSince:null,x:7+Math.random()*70,y:18+Math.random()*48,adoptedAt:Date.now()};
        state.pets.push(pet);selectedPetId=pet.id;
        saveState();
        closeBackdrop("adopt-backdrop");
        renderGarden();
        toast("领养成功，"+sp.name+"已经入住动物园");
      });
    });
  }

  /* feed */
  const feedBackdrop=document.getElementById("feed-backdrop");
  let feedingPetId=null;
  function openFeedSheet(petId){
    feedingPetId=petId;
    renderFeedSheet();
    openBackdrop("feed-backdrop");
  }
  function renderFeedSheet(){
    const pet=state.pets.find(p=>p.id===feedingPetId);
    if(!pet) return;
    const sp=SPECIES.find(s=>s.id===pet.species)||SPECIES[0];
    document.getElementById("feed-pet-preview").innerHTML=`
      <canvas id="feed-preview-canvas"></canvas>
      <div class="fp-name">${sp.name}</div>
      <div class="fp-stage${pet.satiety<=0?" zoo-critical":""}">${petStateLabel(pet)}</div>
      <div class="feed-preview-meters"><div><div class="zoo-meter-label"><span>饱腹</span><span>${Math.round(pet.satiety)}</span></div><div class="zoo-meter hunger"><i style="width:${pet.satiety}%"></i></div></div><div><div class="zoo-meter-label"><span>心情</span><span>${Math.round(pet.mood)}</span></div><div class="zoo-meter mood"><i style="width:${pet.mood}%"></i></div></div></div>
    `;
    drawPetSprite(document.getElementById("feed-preview-canvas"),pet.species,pet.satiety<25?"hungry":"neutral");
    const foodGrid=document.getElementById("food-grid");
    const hint='<div class="feed-hint">从背包选择食物投喂；食物可以通过抽卡获得</div>';
    foodGrid.innerHTML=FOODS.filter(f=>canPetEatFood(pet,f)).map(f=>{
      const owned=state.zooInventory[f.id]||0,disabled=owned<1;
      return `<button class="food-opt${disabled?" disabled":""}" data-id="${f.id}" ${disabled?"disabled":""}>
        <canvas class="f-food-icon" data-food="${f.id}"></canvas>
        <span class="f-body"><span class="f-name">${f.name}</span><br><span class="f-desc">饱腹 +${f.satiety} · 心情 +${f.mood}</span></span>
        <span class="f-owned">背包 ${owned}</span>
      </button>`;
    }).join("")+hint;
    drawFoodIcons(foodGrid);
    foodGrid.querySelectorAll(".food-opt:not(.disabled)").forEach(btn=>{
      btn.addEventListener("click",()=>feedPet(pet.id,btn.dataset.id));
    });
  }
  document.getElementById("feed-close-btn").addEventListener("click",()=>closeBackdrop("feed-backdrop"));
  feedBackdrop.addEventListener("click",(e)=>{ if(e.target===feedBackdrop) closeBackdrop("feed-backdrop"); });

  /* points gacha */
  const gachaBackdrop=document.getElementById("gacha-backdrop");
  const gachaMachine=document.getElementById("gacha-machine");
  const gachaResults=document.getElementById("gacha-results");
  const gachaStatus=document.getElementById("gacha-status");
  const gachaSingleBtn=document.getElementById("gacha-single-btn");
  const gachaTenBtn=document.getElementById("gacha-ten-btn");
  let gachaDrawing=false;

  function updateGachaControls(){
    const balance=pointsBalance();
    document.getElementById("gacha-points").textContent=balance;
    els.pointsTotal.textContent=balance;
    gachaSingleBtn.disabled=gachaDrawing||balance<3;
    gachaTenBtn.disabled=gachaDrawing||balance<30;
  }
  document.getElementById("gacha-open-btn").addEventListener("click",()=>{
    gachaResults.innerHTML="";
    gachaStatus.textContent="准备好抽取食物啦";
    updateGachaControls();
    openBackdrop("gacha-backdrop");
  });
  document.getElementById("gacha-close-btn").addEventListener("click",()=>closeBackdrop("gacha-backdrop"));
  gachaBackdrop.addEventListener("click",e=>{if(e.target===gachaBackdrop) closeBackdrop("gacha-backdrop");});

  function runFoodGacha(count,cost){
    if(gachaDrawing) return;
    if(!spendPoints(cost)){toast("积分不够啦，再完成几件任务吧");updateGachaControls();return;}
    gachaDrawing=true;
    saveState();
    gachaResults.innerHTML="";
    gachaStatus.textContent=count===1?"食盒转动中…":"十连食盒正在转动…";
    gachaMachine.classList.add("is-drawing");
    updateGachaControls();
    setTimeout(()=>{
      const rewards=Array.from({length:count},()=>FOODS[Math.floor(Math.random()*FOODS.length)]);
      rewards.forEach(food=>{state.zooInventory[food.id]=(state.zooInventory[food.id]||0)+1;});
      saveState();
      gachaMachine.classList.remove("is-drawing");
      gachaResults.innerHTML=rewards.map((food,index)=>`<div class="gacha-result" style="animation-delay:${index*55}ms"><canvas data-food="${food.id}"></canvas><span>${food.name}</span></div>`).join("");
      drawFoodIcons(gachaResults);
      gachaStatus.textContent=count===1?"抽到一份 "+rewards[0].name+"！":"十份食物已全部放进背包！";
      gachaDrawing=false;
      updateGachaControls();
      renderSelectedPet();
    },count===1?720:950);
  }
  gachaSingleBtn.addEventListener("click",()=>runFoodGacha(1,3));
  gachaTenBtn.addEventListener("click",()=>runFoodGacha(10,30));

  /* ---------------- reminders ---------------- */
  const bellBtn=document.getElementById("bell-btn");
  function updateBellButton(){
    const enabled=state.notificationsEnabled===true;
    bellBtn.classList.toggle("is-on",enabled);
    bellBtn.setAttribute("aria-pressed",enabled?"true":"false");
    bellBtn.setAttribute("aria-label",enabled?"关闭日程通知":"开启日程通知");
    bellBtn.title=enabled?"关闭日程通知":"开启日程通知";
  }
  function maybeAskNotificationPermission(){
    if(state.notificationsEnabled && "Notification" in window && Notification.permission==="default"){
      Notification.requestPermission();
    }
  }
  bellBtn.addEventListener("click",async()=>{
    if(state.notificationsEnabled){
      state.notificationsEnabled=false;
      saveState();
      updateBellButton();
      toast("日程通知已关闭");
      return;
    }
    state.notificationsEnabled=true;
    saveState();
    updateBellButton();
    if(!("Notification" in window)){
      toast("页面内提醒已开启");
      return;
    }
    if(Notification.permission==="default"){
      try{ await Notification.requestPermission(); }catch(e){ /* keep in-page reminders enabled */ }
    }
    toast(Notification.permission==="granted"?"日程通知已开启":"页面内提醒已开启");
  });
  updateBellButton();

  function fireReminder(schedule,isLead){
    const title = isLead ? "⏰ 即将开始："+schedule.name : "🔔 现在开始："+schedule.name;
    const body = schedule.start+"–"+schedule.end+(isLead?"（提前提醒）":"");
    if("Notification" in window && Notification.permission==="granted"){
      try{ new Notification(title,{body}); }catch(e){ /* ignore */ }
    }
    playAlertTone();
    document.getElementById("alert-title").textContent = isLead? "日程即将开始":"日程提醒";
    document.getElementById("alert-body").textContent = schedule.name+"　"+schedule.start+"–"+schedule.end;
    openBackdrop("alert-backdrop");
  }
  document.getElementById("alert-ok-btn").addEventListener("click",()=>closeBackdrop("alert-backdrop"));

  function checkReminders(){
    if(!state.notificationsEnabled) return;
    const now=new Date();
    let dirty=false;
    Object.keys(state.days).forEach(dateStr=>{
      const day=state.days[dateStr];
      if(!day.schedule) return;
      day.schedule.forEach(s=>{
        if(s.hasTime===false||!s.start||!s.end) return;
        const parts=dateStr.split("-").map(Number);
        const [sh,sm]=s.start.split(":").map(Number);
        const startTime=new Date(parts[0],parts[1]-1,parts[2],sh,sm,0).getTime();
        if(s.leadMinutes>0 && !s.notifiedLead && now.getTime()>=startTime-s.leadMinutes*60000 && now.getTime()<startTime){
          s.notifiedLead=true; dirty=true; fireReminder(s,true);
        }
        if(!s.notifiedOnTime && now.getTime()>=startTime && now.getTime()<startTime+60000){
          s.notifiedOnTime=true; dirty=true; fireReminder(s,false);
        }
      });
    });
    if(dirty) saveState();
  }
  setInterval(checkReminders,15000);

  /* ---------------- milestone modal close ---------------- */
  document.getElementById("milestone-ok-btn").addEventListener("click",()=>closeBackdrop("milestone-backdrop"));
  document.getElementById("milestone-backdrop").addEventListener("click",(e)=>{ if(e.target.id==="milestone-backdrop") closeBackdrop("milestone-backdrop"); });
  document.getElementById("alert-backdrop").addEventListener("click",(e)=>{ if(e.target.id==="alert-backdrop") closeBackdrop("alert-backdrop"); });

  /* ---------------- sort menu (icon + popover) ---------------- */
  const SORT_OPTIONS_BASE=[
    {value:"custom",label:"自定义排序"},
    {value:"priority-desc",label:"优先级 高→低"},
    {value:"priority-asc",label:"优先级 低→高"},
    {value:"created-desc",label:"添加时间 新→旧"},
    {value:"created-asc",label:"添加时间 旧→新"},
  ];
  const SORT_OPTIONS_SCHEDULE=[
    {value:"time",label:"任务时间"},
    ...SORT_OPTIONS_BASE,
  ];
  const SCHEDULE_RANGE_OPTIONS=[
    {value:"week",label:"本周"},
    {value:"fortnight",label:"未来两周"},
    {value:"month",label:"未来一月"},
    {value:"all",label:"全部"},
  ];
  function scheduleRangeLabel(value){
    const option=SCHEDULE_RANGE_OPTIONS.find(item=>item.value===value);
    return option?option.label:"本周";
  }
  let activeSortMenu=null;
  let activeScheduleRangeMenu=null;
  function closeSortMenu(){ if(activeSortMenu){ activeSortMenu.remove(); activeSortMenu=null; document.removeEventListener("click",onOutsideSortMenu,{capture:true}); } }
  function onOutsideSortMenu(e){ if(activeSortMenu && !activeSortMenu.contains(e.target) && !e.target.closest(".sort-icon-btn")) closeSortMenu(); }
  function closeScheduleRangeMenu(){
    if(!activeScheduleRangeMenu) return;
    activeScheduleRangeMenu.remove();
    activeScheduleRangeMenu=null;
    document.getElementById("schedule-range-btn").setAttribute("aria-expanded","false");
    document.removeEventListener("click",onOutsideScheduleRangeMenu,{capture:true});
  }
  function onOutsideScheduleRangeMenu(e){
    if(activeScheduleRangeMenu && !activeScheduleRangeMenu.contains(e.target) && !e.target.closest("#schedule-range-btn")) closeScheduleRangeMenu();
  }
  document.getElementById("schedule-range-btn").addEventListener("click",(e)=>{
    const wasOpen=!!activeScheduleRangeMenu;
    closeScheduleRangeMenu();
    closeSortMenu();
    if(wasOpen) return;
    const btn=e.currentTarget;
    const menu=document.createElement("div");
    menu.className="sort-menu schedule-range-menu";
    menu.setAttribute("role","menu");
    menu.setAttribute("aria-label","日程显示范围");
    menu.innerHTML=SCHEDULE_RANGE_OPTIONS.map(option=>'<button type="button" role="menuitemradio" aria-checked="'+(state.scheduleRange===option.value)+'" data-value="'+option.value+'" class="'+(state.scheduleRange===option.value?"active":"")+'">'+option.label+'</button>').join("");
    document.body.appendChild(menu);
    const rect=btn.getBoundingClientRect();
    let left=rect.left;
    if(left+168>window.innerWidth-10) left=window.innerWidth-178;
    if(left<10) left=10;
    menu.style.left=left+"px";
    menu.style.top=(rect.bottom+6)+"px";
    activeScheduleRangeMenu=menu;
    btn.setAttribute("aria-expanded","true");
    menu.addEventListener("click",(ev)=>{
      const optionBtn=ev.target.closest("button");
      if(!optionBtn) return;
      state.scheduleRange=optionBtn.dataset.value;
      saveState();
      renderToday();
      closeScheduleRangeMenu();
    });
    setTimeout(()=>document.addEventListener("click",onOutsideScheduleRangeMenu,{capture:true}),0);
    e.stopPropagation();
  });
  ["recurring","temp","schedule"].forEach(section=>{
    document.getElementById("sort-"+section+"-btn").addEventListener("click",(e)=>{
      closeScheduleRangeMenu();
      closeSortMenu();
      const btn=e.currentTarget;
      const options=section==="schedule"?SORT_OPTIONS_SCHEDULE:SORT_OPTIONS_BASE;
      const menu=document.createElement("div");
      menu.className="sort-menu";
      menu.innerHTML=options.map(o=>'<button data-value="'+o.value+'" class="'+(state.sortMode[section]===o.value?"active":"")+'">'+o.label+'</button>').join("");
      document.body.appendChild(menu);
      const rect=btn.getBoundingClientRect();
      let left=rect.right-168;
      if(left<10) left=10;
      menu.style.left=left+"px";
      menu.style.top=(rect.bottom+window.scrollY+6)+"px";
      activeSortMenu=menu;
      menu.addEventListener("click",(ev)=>{
        const optBtn=ev.target.closest("button");
        if(!optBtn) return;
        state.sortMode[section]=optBtn.dataset.value;
        saveState(); renderToday();
        closeSortMenu();
      });
      setTimeout(()=>document.addEventListener("click",onOutsideSortMenu,{capture:true}),0);
      e.stopPropagation();
    });
  });

  /* ---------------- init ---------------- */
  renderToday();
  checkReminders();
})();
</script>
</body>
</html>
